services:
  llama:
    image: the-clink-llama-cuda
    container_name: the-clink-llama
    init: true
    build:
      context: .
      dockerfile: llama-cuda.containerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9931/health"]
      interval: 3s
      start_period: 15s
      retries: 5
    restart: always
    devices:
      - "nvidia.com/gpu=all"
    command: [
      "/usr/local/bin/llama-server", "--models-preset", "/home/user/.config/llama.cpp/config.ini",
    ]
    ports:
      - "9931:9931"

  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    container_name: the-clink-meilisearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 3s
      start_period: 5s
      retries: 5
    restart: always
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - $HOME/.config/meilisearch:/meili_data
    ports:
      - "7700:7700"
